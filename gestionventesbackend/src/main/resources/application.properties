spring.application.name=gestionVentesBackend
# ----------------------------------------------------
# Configuration de la Base de Donn�es MySQL (XAMPP)
# ----------------------------------------------------np
# Remplacez 'gestionvente' par le nom de votre base de donn�es
spring.datasource.url=jdbc:mysql://localhost:3307/gestionvente
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------
# Configuration de JPA/Hibernate
# ----------------------------------------------------
# 'update' permet � Hibernate de modifier le sch�ma de la base de donn�es
# en fonction de vos classes @Entity. Utile en d�veloppement.
# Utilisez 'none' ou 'validate' en production.
spring.jpa.hibernate.ddl-auto=update

# Affiche les requ�tes SQL g�n�r�es par Hibernate (pour le d�bogage)
spring.jpa.show-sql=true

# Sp�cifiez le dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------
# Configuration du serveur Spring Boot
# ----------------------------------------------------
server.port=9090

# ----------------------------------------------------
# ETL (Analyste)
# ----------------------------------------------------
# Dossier local où le backend sauvegarde les CSV uploadés
etl.uploadDir=data/uploads

# Commande Python (Windows: py, Linux/macOS: python3)
etl.pythonCommand=python

# Chemin vers l'orchestrateur ETL (Python) - à ajuster selon ton workspace
etl.scriptPath=../gestionventesdata/etl/etl_pipeline.py

# URL SQLAlchemy (ne pas utiliser l'URL JDBC Spring). Exemple MySQL:
# etl.databaseUrl=mysql+pymysql://root:@localhost:3307/gestionvente
# Exemple PostgreSQL:
# etl.databaseUrl=postgresql+psycopg://postgres:password@localhost:5432/gestionvente
etl.databaseUrl=mysql+pymysql://root:@localhost:3307/gestionvente

# Timeout max d'exécution du process Python
etl.timeoutSeconds=600